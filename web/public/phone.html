<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Waink</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #1b1e2e;
            color: #fff;
            font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
            text-transform: uppercase;
        }
        main {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            padding: 0 24px;
            box-sizing: border-box;
        }
        .badge {
            width: 84px;
            height: 84px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .badge img {
            width: 60px;
            height: 60px;
        }
        h1 {
            margin: 0;
            font-size: 34px;
            letter-spacing: 1px;
        }
        p {
            margin: 0;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
        }
        .bar {
            width: 120px;
            height: 4px;
            background: #3ee6ff;
            transform: skewX(-12deg);
        }
    </style>
</head>
<body>
    <main>
        <div class="badge"><img src="./icon.png" alt="" /></div>
        <h1>Waink</h1>
        <div class="bar"></div>
        <p>Vehicle scanner</p>
    </main>
</body>
</html>
